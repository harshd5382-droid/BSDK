name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: distributed-ai-os
    env:
      DAIOS_CI_SKIP_MDNS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/protocol -e apps/node -e apps/launcher ".[dev]"
      - name: Ruff
        run: python -m ruff check packages/ apps/node apps/launcher tests/ benchmarks/
      - name: Pytest
        run: python -m pytest tests/ -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: distributed-ai-os/apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: distributed-ai-os/apps/dashboard/package-lock.json
      - name: Build dashboard
        run: |
          npm ci
          npm run build
