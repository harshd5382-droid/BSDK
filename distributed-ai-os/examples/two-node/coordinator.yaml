# Distributed AI OS — Generation 1

node_id: coordinator-1
role: coordinator

network:
  bind_host: 0.0.0.0
  api_port: 8000
  rpc_port: 50052

peers:
  - id: worker-1
    host: worker
    rpc_port: 50052
    api_port: 8001

inference:
  backend: llama.cpp
  model_path: /models/model.gguf
  llama_server_port: 8080
  n_gpu_layers: 99
  context_size: 4096
  rpc_cache: true
