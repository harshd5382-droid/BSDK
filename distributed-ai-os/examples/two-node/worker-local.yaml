# Real llama.cpp worker on loopback (single-machine two-node validation)
node_id: worker-local
role: worker

network:
  bind_host: 127.0.0.1
  api_port: 8001
  rpc_port: 50052

peers: []

inference:
  backend: llama.cpp
  rpc_server_bin: ggml-rpc-server
  rpc_cache: false
  # Omit threads to use auto-detect (cores - 1); set explicitly to override.
  threads: 3
