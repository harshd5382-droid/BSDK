# Single-node baseline (no RPC) for benchmark comparison
node_id: coordinator-single
role: coordinator

network:
  bind_host: 127.0.0.1
  api_port: 8000
  rpc_port: 50052

peers: []

inference:
  backend: llama.cpp
  llama_server_bin: llama-server
  model_path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
  llama_server_port: 8080
  n_gpu_layers: 99
  context_size: 2048
  # Omit threads to use auto-detect (cores - 1); set explicitly to override.
  threads: 3
