[project]
name = "distributed-ai-os"
version = "0.1.0"
description = "Generation 1 prototype — Peer-to-Peer Distributed AI Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Harsh Desai" }]

[project.urls]
Homepage = "https://github.com/harshd5382-droid/BSDK"
Repository = "https://github.com/harshd5382-droid/BSDK"
Issues = "https://github.com/harshd5382-droid/BSDK/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

# This root project only carries dev extras and tool config; the real packages live under
# packages/ and apps/. Without this, setuptools' flat-layout discovery refuses to build.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/protocol/src", "apps/node/src", "apps/launcher/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly (Ruff's classic defaults) so a newer Ruff release with broader
# defaults can't silently change what CI enforces. Widen deliberately, in its own change.
select = ["E4", "E7", "E9", "F"]
