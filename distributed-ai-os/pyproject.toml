[project]
name = "distributed-ai-os"
version = "0.1.0"
description = "Generation 1 prototype — Peer-to-Peer Distributed AI Operating System"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/protocol/src", "apps/node/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
