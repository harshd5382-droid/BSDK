[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daios-launcher"
version = "0.1.0"
description = "DAIOS launcher service — one-click node control and dashboard API"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Harsh Desai" }]
dependencies = [
    "daios-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.26",
]

[project.urls]
Homepage = "https://github.com/harshd5382-droid/BSDK"
Repository = "https://github.com/harshd5382-droid/BSDK"
Issues = "https://github.com/harshd5382-droid/BSDK/issues"

[tool.uv.sources]
daios-protocol = { path = "../../packages/protocol" }

[project.scripts]
daios-launcher = "daios_launcher.cli:main"
daios-worker = "daios_launcher.bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daios_launcher"]
