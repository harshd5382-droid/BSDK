[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daios-launcher"
version = "0.1.0"
description = "DAIOS launcher service — one-click node control and dashboard API"
requires-python = ">=3.11"
dependencies = [
    "daios-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psutil>=6.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
daios-protocol = { path = "../../packages/protocol" }

[project.scripts]
daios-launcher = "daios_launcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daios_launcher"]
