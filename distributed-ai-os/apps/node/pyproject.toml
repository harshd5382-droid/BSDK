[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daios-node"
version = "0.1.0"
description = "Distributed AI OS node daemon (Generation 1+)"
requires-python = ">=3.11"
dependencies = [
    "daios-protocol",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.optional-dependencies]
discovery = ["zeroconf>=0.132"]
security = ["cryptography>=43.0"]

[tool.uv.sources]
daios-protocol = { path = "../../packages/protocol" }

[project.scripts]
daios-node = "daios_node.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daios_node"]
